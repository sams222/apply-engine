[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apply-engine"
version = "0.2.0"
description = "Private apply-engine for Applier: tailor a truthful resume, fill ATS forms, hard-stop before submit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45",
    "fpdf2>=2.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
apply-engine = "apply_engine.cli:main"

[tool.setuptools.packages.find]
include = ["apply_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
